  # === SCALED SHOP SERVICE (3 replicas) ===
  shop-service-1:
    image: ${SHOP_IMAGE:-vain12/shop-service}
    platform: linux/amd64
    container_name: cpr-shop-service-1
    depends_on:
      shop-postgres:
        condition: service_healthy
      message-broker:  # ← ADD THIS
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      SHOP_DB_CONNECTION: Host=shop-postgres;Port=5432;Database=${SHOP_POSTGRES_DB};Username=${SHOP_POSTGRES_USER};Password=${SHOP_POSTGRES_PASSWORD}
      ConnectionStrings__ShopDatabase: Host=shop-postgres;Port=5432;Database=${SHOP_POSTGRES_DB};Username=${SHOP_POSTGRES_USER};Password=${SHOP_POSTGRES_PASSWORD}
      MESSAGE_BROKER_URL: http://message-broker:8002  # ← ADD THIS
      SERVICE_NAME: shop-service-1  # ← ADD THIS
