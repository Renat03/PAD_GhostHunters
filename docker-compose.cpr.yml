version: "3.9"

services:
  # === Databases ===
  
  shop-postgres:
    image: postgres:16
    platform: linux/amd64
    container_name: cpr-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SHOP_POSTGRES_DB}
      POSTGRES_USER: ${SHOP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SHOP_POSTGRES_PASSWORD}
    volumes:
      - cpr_shop_pgdata:/var/lib/postgresql/data
      - ./microservices/shop-service/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    command: ["postgres", "-c", "log_statement=all", "-c", "log_min_duration_statement=0"]
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHOP_POSTGRES_USER} -d ${SHOP_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  journal-postgres:
    image: postgres:16
    platform: linux/amd64
    container_name: cpr-journal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JOURNAL_POSTGRES_DB}
      POSTGRES_USER: ${JOURNAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JOURNAL_POSTGRES_PASSWORD}
    volumes:
      - cpr_journal_pgdata:/var/lib/postgresql/data
      - ./microservices/journal-service/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    command: ["postgres", "-c", "log_statement=all", "-c", "log_min_duration_statement=0"]
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOURNAL_POSTGRES_USER} -d ${JOURNAL_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ghost-postgres:
    image: postgres:16
    platform: linux/amd64
    container_name: cpr-ghost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GHOST_POSTGRES_USER:-ghostuser}
      POSTGRES_PASSWORD: ${GHOST_POSTGRES_PASSWORD:-ghostpass}
      POSTGRES_DB: ${GHOST_POSTGRES_DB:-ghostdb}
    volumes:
      - cpr_ghost_pgdata:/var/lib/postgresql/data
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GHOST_POSTGRES_USER:-ghostuser} -d ${GHOST_POSTGRES_DB:-ghostdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chat-postgres:
    image: postgres:16
    platform: linux/amd64
    container_name: cpr-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHAT_POSTGRES_DB:-chatdb}
      POSTGRES_USER: ${CHAT_POSTGRES_USER:-chatuser}
      POSTGRES_PASSWORD: ${CHAT_POSTGRES_PASSWORD:-chatpass}
    volumes:
      - cpr_chat_pgdata:/var/lib/postgresql/data
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHAT_POSTGRES_USER:-chatuser} -d ${CHAT_POSTGRES_DB:-chatdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-postgres:
    image: postgres:16
    platform: linux/amd64
    container_name: cpr-inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB:-inventorydb}
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER:-inventoryuser}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:-inventorypass}
    volumes:
      - cpr_inventory_pgdata:/var/lib/postgresql/data
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_POSTGRES_USER:-inventoryuser} -d ${INVENTORY_POSTGRES_DB:-inventorydb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  lobby-mongodb:
    image: mongo:7.0
    platform: linux/amd64
    container_name: cpr-lobby-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${LOBBY_MONGO_USER:-lobbyadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${LOBBY_MONGO_PASSWORD:-lobbypass}
      MONGO_INITDB_DATABASE: ${LOBBY_MONGO_DB:-lobbydb}
    volumes:
      - cpr_lobby_mongodb:/data/db
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  map-mongodb:
