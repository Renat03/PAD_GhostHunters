    image: ${LOCATION_IMAGE:-sergiudimbitchi/location-service}
    # platform: linux/amd64  # ❌ REMOVED - Let Docker handle it
    container_name: cpr-location-service-2
    environment:
      PORT: "8001"
      NODE_ENV: production
    expose:
      - "8001"
    networks:
      - cpr-network
    restart: unless-stopped

  # === Gateway Service ===
  gateway-service:
    build:
      context: ./microservices/gateway-service
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: cpr-gateway-service
    depends_on:
      - service-discovery
      - shop-service-1
      - journal-service-1
      - ghost-service-1
      - ghost-ai-service-1
      - user-management-service-1
      - lobby-service-1
      - map-service-1
      - chat-service-1
      - inventory-service-1
      - location-service-1
    environment:
      PORT: "8080"
      SHOP_BASE_URL: "http://shop-service-1:8080"
      JOURNAL_BASE_URL: "http://journal-service-1:8080"
      GHOST_BASE_URL: "http://ghost-service-1:8000"
      GHOST_AI_BASE_URL: "http://ghost-ai-service-1:3002"
      USER_BASE_URL: "http://user-management-service-1:3001"
      LOBBY_BASE_URL: "http://lobby-service-1:8080"
      MAP_BASE_URL: "http://map-service-1:8081"
      CHAT_BASE_URL: "http://chat-service-1:8080"
      INVENTORY_BASE_URL: "http://inventory-service-1:8080"
      LOCATION_BASE_URL: "http://location-service-1:8001"
      SERVICE_DISCOVERY_URL: "http://service-discovery:8000"
    ports:
      - "${GATEWAY_PORT:-8081}:8080"
    networks:
      - cpr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === SERVICE DISCOVERY ===
  service-discovery:
    build:
      context: ./microservices/service-discovery
      dockerfile: Dockerfile
    container_name: cpr-service-discovery
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    networks:
      - cpr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# === MESSAGE BROKER ===

  message-broker:
    build:
      context: ./microservices/message-broker
      dockerfile: Dockerfile
    image: ${MESSAGE_BROKER_IMAGE:-vain12/message-broker:latest}
    container_name: cpr-message-broker
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  cpr_shop_pgdata:
  cpr_journal_pgdata:
  cpr_ghost_pgdata:
  cpr_chat_pgdata:
  cpr_inventory_pgdata:
  cpr_lobby_mongodb:
  cpr_map_mongodb:
  cpr_user_mongodb:
  cpr_ghost_ai_mongodb:

networks:
  cpr-network:
    driver: bridge