      JOURNAL_DB_CONNECTION: Host=journal-postgres-primary;Port=5432;Database=${JOURNAL_POSTGRES_DB:-journaldb};Username=${JOURNAL_POSTGRES_USER:-journaluser};Password=${JOURNAL_POSTGRES_PASSWORD:-journalpass}
      ConnectionStrings__JournalDatabase: Host=journal-postgres-primary;Port=5432;Database=${JOURNAL_POSTGRES_DB:-journaldb};Username=${JOURNAL_POSTGRES_USER:-journaluser};Password=${JOURNAL_POSTGRES_PASSWORD:-journalpass}
    expose:
      - "8080"
    networks:
      - cpr-network
    restart: unless-stopped

  journal-service-3:
    image: ${JOURNAL_IMAGE:-vain12/journal-service}
    platform: linux/amd64
    container_name: cpr-journal-service-3
    depends_on:
      journal-postgres-primary:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      JOURNAL_DB_CONNECTION: Host=journal-postgres-primary;Port=5432;Database=${JOURNAL_POSTGRES_DB:-journaldb};Username=${JOURNAL_POSTGRES_USER:-journaluser};Password=${JOURNAL_POSTGRES_PASSWORD:-journalpass}
      ConnectionStrings__JournalDatabase: Host=journal-postgres-primary;Port=5432;Database=${JOURNAL_POSTGRES_DB:-journaldb};Username=${JOURNAL_POSTGRES_USER:-journaluser};Password=${JOURNAL_POSTGRES_PASSWORD:-journalpass}
    expose:
      - "8080"
    networks:
      - cpr-network
    restart: unless-stopped

  # === SCALED INVENTORY SERVICE (3 replicas) - Connect to PRIMARY ===
  inventory-service-1:
    image: ${INVENTORY_IMAGE:-renat03/inventory-service}
    platform: linux/amd64
    container_name: cpr-inventory-service-1
    depends_on:
      inventory-postgres-primary:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=inventory-postgres-primary;Port=5432;Database=${INVENTORY_POSTGRES_DB:-inventorydb};Username=${INVENTORY_POSTGRES_USER:-inventoryuser};Password=${INVENTORY_POSTGRES_PASSWORD:-inventorypass}
      MESSAGE_BROKER_URL: http://message-broker:8002
      SERVICE_NAME: inventory-service-1
    expose:
      - "8080"
    networks:
      - cpr-network
    restart: unless-stopped

  inventory-service-2:
    image: ${INVENTORY_IMAGE:-renat03/inventory-service}
    platform: linux/amd64
    container_name: cpr-inventory-service-2
    depends_on:
      inventory-postgres-primary:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=inventory-postgres-primary;Port=5432;Database=${INVENTORY_POSTGRES_DB:-inventorydb};Username=${INVENTORY_POSTGRES_USER:-inventoryuser};Password=${INVENTORY_POSTGRES_PASSWORD:-inventorypass}
      MESSAGE_BROKER_URL: http://message-broker:8002
      SERVICE_NAME: inventory-service-2
    expose:
      - "8080"
    networks:
      - cpr-network
    restart: unless-stopped

  inventory-service-3:
    image: ${INVENTORY_IMAGE:-renat03/inventory-service}
    platform: linux/amd64
    container_name: cpr-inventory-service-3
    depends_on:
      inventory-postgres-primary:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=inventory-postgres-primary;Port=5432;Database=${INVENTORY_POSTGRES_DB:-inventorydb};Username=${INVENTORY_POSTGRES_USER:-inventoryuser};Password=${INVENTORY_POSTGRES_PASSWORD:-inventorypass}
      MESSAGE_BROKER_URL: http://message-broker:8002
      SERVICE_NAME: inventory-service-3
    expose:
      - "8080"
    networks:
      - cpr-network
    restart: unless-stopped

  # === SCALED CHAT SERVICE (3 replicas) - Connect to PRIMARY ===
  chat-service-1:
    image: ${CHAT_IMAGE:-renat03/chat-service}
    platform: linux/amd64
    container_name: cpr-chat-service-1
    depends_on:
      chat-postgres-primary:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=chat-postgres-primary;Port=5432;Database=${CHAT_POSTGRES_DB:-chatdb};Username=${CHAT_POSTGRES_USER:-chatuser};Password=${CHAT_POSTGRES_PASSWORD:-chatpass}
    expose:
      - "8080"
    networks:
      - cpr-network
    restart: unless-stopped

  chat-service-2:
    image: ${CHAT_IMAGE:-renat03/chat-service}
    platform: linux/amd64
    container_name: cpr-chat-service-2
    depends_on:
      chat-postgres-primary:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=chat-postgres-primary;Port=5432;Database=${CHAT_POSTGRES_DB:-chatdb};Username=${CHAT_POSTGRES_USER:-chatuser};Password=${CHAT_POSTGRES_PASSWORD:-chatpass}
    expose:
      - "8080"
    networks:
      - cpr-network
    restart: unless-stopped

  chat-service-3:
    image: ${CHAT_IMAGE:-renat03/chat-service}
    platform: linux/amd64
    container_name: cpr-chat-service-3
    depends_on:
      chat-postgres-primary:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=chat-postgres-primary;Port=5432;Database=${CHAT_POSTGRES_DB:-chatdb};Username=${CHAT_POSTGRES_USER:-chatuser};Password=${CHAT_POSTGRES_PASSWORD:-chatpass}
    expose:
      - "8080"
    networks:
      - cpr-network
    restart: unless-stopped

  # === SCALED GHOST SERVICE (2 replicas) - Connect to PRIMARY ===
  ghost-service-1:
    image: ${GHOST_IMAGE:-sergiudimbitchi/ghost-service-ts}
    container_name: cpr-ghost-service-1
    depends_on:
      ghost-postgres-primary:
        condition: service_healthy
    environment:
      PORT: "8000"
      NODE_ENV: "production"
      STORAGE_BACKEND: "postgres"
      DATABASE_URL: "postgres://${GHOST_POSTGRES_USER:-ghostuser}:${GHOST_POSTGRES_PASSWORD:-ghostpass}@ghost-postgres-primary:5432/${GHOST_POSTGRES_DB:-ghostdb}"
    expose:
      - "8000"
    networks:
      - cpr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ghost-service-2:
    image: ${GHOST_IMAGE:-sergiudimbitchi/ghost-service-ts}
    container_name: cpr-ghost-service-2
    depends_on:
      ghost-postgres-primary:
        condition: service_healthy
    environment:
      PORT: "8000"
      NODE_ENV: "production"
      STORAGE_BACKEND: "postgres"
      DATABASE_URL: "postgres://${GHOST_POSTGRES_USER:-ghostuser}:${GHOST_POSTGRES_PASSWORD:-ghostpass}@ghost-postgres-primary:5432/${GHOST_POSTGRES_DB:-ghostdb}"
    expose:
      - "8000"
    networks:
      - cpr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # === SCALED GHOST AI SERVICE (2 replicas) ===
  ghost-ai-service-1:
    image: ${GHOST_AI_IMAGE:-eugenostafi/ghost-ai-service}
    platform: linux/amd64
    container_name: cpr-ghost-ai-service-1
    depends_on:
      - ghost-ai-mongodb-primary
    environment:
      NODE_ENV: production
      PORT: "3002"
      MONGODB_URI: mongodb://ghost-ai-mongodb-primary:27017/${GHOST_AI_MONGO_DB:-ghostai}?replicaSet=ghostai-rs
    expose:
      - "3002"
    networks:
      - cpr-network
    restart: unless-stopped

  ghost-ai-service-2:
    image: ${GHOST_AI_IMAGE:-eugenostafi/ghost-ai-service}
    platform: linux/amd64
    container_name: cpr-ghost-ai-service-2
    depends_on:
      - ghost-ai-mongodb-primary
    environment:
      NODE_ENV: production
      PORT: "3002"
      MONGODB_URI: mongodb://ghost-ai-mongodb-primary:27017/${GHOST_AI_MONGO_DB:-ghostai}?replicaSet=ghostai-rs
    expose:
      - "3002"
    networks:
      - cpr-network
    restart: unless-stopped

  # === SCALED USER MANAGEMENT SERVICE (2 replicas) ===
  user-management-service-1:
    image: ${USER_IMAGE:-eugenostafi/user-management-service}
    platform: linux/amd64
    container_name: cpr-user-management-service-1
    depends_on:
      - user-mongodb-primary
    environment:
      NODE_ENV: production
      PORT: "3001"
      MONGODB_URI: mongodb://user-mongodb-primary:27017/${USER_MONGO_DB:-user_management}?replicaSet=user-rs
    expose:
      - "3001"
    networks:
      - cpr-network
    restart: unless-stopped

  user-management-service-2:
    image: ${USER_IMAGE:-eugenostafi/user-management-service}
    platform: linux/amd64
    container_name: cpr-user-management-service-2
    depends_on:
      - user-mongodb-primary
    environment:
      NODE_ENV: production
      PORT: "3001"
      MONGODB_URI: mongodb://user-mongodb-primary:27017/${USER_MONGO_DB:-user_management}?replicaSet=user-rs
    expose:
      - "3001"
    networks:
      - cpr-network
    restart: unless-stopped

  # === LOBBY SERVICE (2 replicas) ===
  lobby-service-1:
    image: ${LOBBY_IMAGE:-doschinescu/lobby-service}
    platform: linux/amd64
    container_name: cpr-lobby-service-1
    depends_on:
      lobby-mongodb:
        condition: service_healthy
    environment:
      PORT: "8080"
      NODE_ENV: production
      MONGODB_URI: mongodb://${LOBBY_MONGO_USER:-lobbyadmin}:${LOBBY_MONGO_PASSWORD:-lobbypass}@lobby-mongodb:27017/${LOBBY_MONGO_DB:-lobbydb}?authSource=admin
    expose:
      - "8080"
    networks:
      - cpr-network
    restart: unless-stopped

  lobby-service-2:
    image: ${LOBBY_IMAGE:-doschinescu/lobby-service}
    platform: linux/amd64
    container_name: cpr-lobby-service-2
    depends_on:
      lobby-mongodb:
        condition: service_healthy
    environment:
      PORT: "8080"
      NODE_ENV: production
      MONGODB_URI: mongodb://${LOBBY_MONGO_USER:-lobbyadmin}:${LOBBY_MONGO_PASSWORD:-lobbypass}@lobby-mongodb:27017/${LOBBY_MONGO_DB:-lobbydb}?authSource=admin
    expose:
      - "8080"
    networks:
      - cpr-network
    restart: unless-stopped

  # === MAP SERVICE (2 replicas) ===
  map-service-1:
    image: ${MAP_IMAGE:-doschinescu/map-service}
    platform: linux/amd64
    container_name: cpr-map-service-1
    depends_on:
      map-mongodb:
        condition: service_healthy
    environment:
      PORT: "8081"
      NODE_ENV: production
      MONGODB_URI: mongodb://${MAP_MONGO_USER:-mapadmin}:${MAP_MONGO_PASSWORD:-mappass}@map-mongodb:27017/${MAP_MONGO_DB:-mapdb}?authSource=admin
    expose:
      - "8081"
    networks:
      - cpr-network
    restart: unless-stopped

  map-service-2:
    image: ${MAP_IMAGE:-doschinescu/map-service}
    platform: linux/amd64
    container_name: cpr-map-service-2
    depends_on:
      map-mongodb:
        condition: service_healthy
    environment:
      PORT: "8081"
      NODE_ENV: production
      MONGODB_URI: mongodb://${MAP_MONGO_USER:-mapadmin}:${MAP_MONGO_PASSWORD:-mappass}@map-mongodb:27017/${MAP_MONGO_DB:-mapdb}?authSource=admin
    expose:
      - "8081"
    networks:
      - cpr-network
    restart: unless-stopped

  # === LOCATION SERVICE (2 replicas) ===
  location-service-1:
    image: ${LOCATION_IMAGE:-sergiudimbitchi/location-service}
    container_name: cpr-location-service-1
    environment:
      PORT: "8001"
      NODE_ENV: production
    expose:
      - "8001"
    networks:
      - cpr-network
    restart: unless-stopped

  location-service-2:
    image: ${LOCATION_IMAGE:-sergiudimbitchi/location-service}
    container_name: cpr-location-service-2
    environment:
      PORT: "8001"
      NODE_ENV: production
    expose:
      - "8001"
    networks:
      - cpr-network
    restart: unless-stopped

  # === Gateway Service ===
  gateway-service:
    build:
      context: ./microservices/gateway-service
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: cpr-gateway-service
    depends_on:
      - service-discovery
      - redis-cache-1
      - redis-cache-2
      - redis-cache-3
      - shop-service-1
      - journal-service-1
      - ghost-service-1
      - ghost-ai-service-1
      - user-management-service-1
      - lobby-service-1
      - map-service-1
      - chat-service-1
      - inventory-service-1
      - location-service-1
    environment:
      PORT: "8080"
      MESSAGE_BROKER_URL: "http://message-broker:8002"
      SHOP_BASE_URL: "http://shop-service-1:8080"
      JOURNAL_BASE_URL: "http://journal-service-1:8080"
      GHOST_BASE_URL: "http://ghost-service-1:8000"
      GHOST_AI_BASE_URL: "http://ghost-ai-service-1:3002"
      USER_BASE_URL: "http://user-management-service-1:3001"
      LOBBY_BASE_URL: "http://lobby-service-1:8080"
      MAP_BASE_URL: "http://map-service-1:8081"
      CHAT_BASE_URL: "http://chat-service-1:8080"
      INVENTORY_BASE_URL: "http://inventory-service-1:8080"
      LOCATION_BASE_URL: "http://location-service-1:8001"
      SERVICE_DISCOVERY_URL: "http://service-discovery:8000"
      REDIS_NODES: "redis-cache-1:6379,redis-cache-2:6379,redis-cache-3:6379"
      REDIS_URL: "redis://redis-cache-1:6379"
      CONSISTENT_HASH_REPLICAS: "150"
      CACHE_ENABLED: "true"
      CACHE_DEFAULT_TTL: "300"
    ports:
      - "${GATEWAY_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cpr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === SERVICE DISCOVERY ===
  service-discovery:
    build:
      context: ./microservices/service-discovery
      dockerfile: Dockerfile
    container_name: cpr-service-discovery
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    networks:
      - cpr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === MESSAGE BROKER ===
  message-broker:
    build:
      context: ./microservices/message-broker
      dockerfile: Dockerfile
    image: ${MESSAGE_BROKER_IMAGE:-vain12/message-broker:latest}
    container_name: cpr-message-broker
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================
  # REDIS CACHE CLUSTER (for Consistent Hashing)
  # ============================================
  redis-cache-1:
    image: redis:7-alpine
    container_name: cpr-redis-cache-1
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6382:6379"
    volumes:
      - cpr_redis_cache_1:/data
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis-cache-2:
    image: redis:7-alpine
    container_name: cpr-redis-cache-2
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6383:6379"
    volumes:
      - cpr_redis_cache_2:/data
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis-cache-3:
    image: redis:7-alpine
    container_name: cpr-redis-cache-3
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6384:6379"
    volumes:
      - cpr_redis_cache_3:/data
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ============================================
  # DATA WAREHOUSE & ETL
  # ============================================
  
  data-warehouse:
    image: postgres:16
    container_name: cpr-data-warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: data_warehouse
      POSTGRES_USER: dw_user
      POSTGRES_PASSWORD: dw_pass
    volumes:
      - cpr_data_warehouse:/var/lib/postgresql/data
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw_user -d data_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl-service:
    build:
      context: ./microservices/etl-service
      dockerfile: Dockerfile
    container_name: cpr-etl-service
    depends_on:
      data-warehouse:
        condition: service_healthy
      shop-postgres-primary:
        condition: service_healthy
      user-mongodb-primary:
        condition: service_healthy
    environment:
      DW_URI: postgresql://dw_user:dw_pass@data-warehouse:5432/data_warehouse
      SHOP_DB_URI: postgresql://shopuser:shoppass@shop-postgres-primary:5432/shopdb
      USER_MONGO_URI: mongodb://user-mongodb-primary:27017/user_management
    networks:
      - cpr-network
    restart: unless-stopped

volumes:
  # PostgreSQL primary/replica volumes
  cpr_shop_primary_pgdata:
  cpr_shop_replica_pgdata:
  cpr_journal_primary_pgdata:
  cpr_journal_replica_pgdata:
  cpr_inventory_primary_pgdata:
  cpr_inventory_replica_pgdata:
  cpr_chat_primary_pgdata:
  cpr_chat_replica_pgdata:
  cpr_ghost_primary_pgdata:
  cpr_ghost_replica_pgdata:
  # MongoDB replica set volumes
  cpr_user_mongodb_primary:
  cpr_user_mongodb_secondary:
  cpr_ghost_ai_mongodb_primary:
  cpr_ghost_ai_mongodb_secondary:
  # Non-replicated databases
  cpr_lobby_mongodb:
  cpr_map_mongodb:
  # Redis cache
  cpr_redis_cache_1:
  cpr_redis_cache_2:
  cpr_redis_cache_3:
  # Data warehouse
  cpr_data_warehouse:

networks:
  cpr-network:
    driver: bridge