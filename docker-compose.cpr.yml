    container_name: cpr-ghost-service-1
    depends_on:
      ghost-postgres:
        condition: service_healthy
    environment:
      PORT: "8000"
      NODE_ENV: "production"
      STORAGE_BACKEND: "postgres"
      DATABASE_URL: "postgres://${GHOST_POSTGRES_USER:-ghostuser}:${GHOST_POSTGRES_PASSWORD:-ghostpass}@ghost-postgres:5432/${GHOST_POSTGRES_DB:-ghostdb}"
    expose:
      - "8000"
    networks:
      - cpr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

