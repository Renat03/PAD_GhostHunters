    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USER_MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${USER_MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${USER_MONGO_DB:-user_management}
    volumes:
      - cpr_user_mongodb:/data/db
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  ghost-ai-mongodb:
