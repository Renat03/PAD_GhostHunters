  # === SCALED SHOP SERVICE (3 replicas) - Connect to PRIMARY ===
  shop-service-1:
    image: ${SHOP_IMAGE:-vain12/shop-service}
    platform: linux/amd64
    container_name: cpr-shop-service-1
    depends_on:
      shop-postgres-primary:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # UPDATED: Removed Target Session Attributes to fix Npgsql error
      SHOP_DB_CONNECTION: Host=shop-postgres-primary,shop-postgres-replica;Port=5432;Database=${SHOP_POSTGRES_DB:-shopdb};Username=${SHOP_POSTGRES_USER:-shopuser};Password=${SHOP_POSTGRES_PASSWORD:-shoppass}
      ConnectionStrings__ShopDatabase: Host=shop-postgres-primary,shop-postgres-replica;Port=5432;Database=${SHOP_POSTGRES_DB:-shopdb};Username=${SHOP_POSTGRES_USER:-shopuser};Password=${SHOP_POSTGRES_PASSWORD:-shoppass}
      MESSAGE_BROKER_URL: http://message-broker:8002
      SERVICE_NAME: shop-service-1
    expose:
