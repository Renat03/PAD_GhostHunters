  # ============================================
  # REPLICATED DATABASES - MongoDB Replica Sets
  # ============================================

  # === USER MANAGEMENT MONGODB REPLICA SET ===
  user-mongodb-primary:
    image: mongo:7.0
    platform: linux/amd64
    container_name: cpr-user-mongodb-primary
    restart: unless-stopped
    command: mongod --replSet user-rs --bind_ip_all
    environment:
      # Remove authentication for development
      MONGO_INITDB_DATABASE: ${USER_MONGO_DB:-user_management}
    volumes:
      - cpr_user_mongodb_primary:/data/db
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  user-mongodb-secondary:
    image: mongo:7.0
