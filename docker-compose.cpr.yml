version: "3.9"

services:
  # ============================================
  # REPLICATED DATABASES - PostgreSQL
  # ============================================
  
  # === SHOP DATABASE CLUSTER ===
  shop-postgres-primary:
    image: postgres:16
    platform: linux/amd64
    container_name: cpr-shop-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SHOP_POSTGRES_DB:-shopdb}
      POSTGRES_USER: ${SHOP_POSTGRES_USER:-shopuser}
      POSTGRES_PASSWORD: ${SHOP_POSTGRES_PASSWORD:-shoppass}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=3
      -c wal_keep_size=64MB
      -c hot_standby=on
      -c max_replication_slots=3
      -c listen_addresses='*'
      -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - cpr_shop_primary_pgdata:/var/lib/postgresql/data
      - ./microservices/shop-service/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./microservices/db-replication/postgres/init-replication.sh:/docker-entrypoint-initdb.d/002-replication.sh:ro
      - ./microservices/db-replication/postgres/pg_hba_replication.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHOP_POSTGRES_USER:-shopuser} -d ${SHOP_POSTGRES_DB:-shopdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  shop-postgres-replica:
    image: postgres:16
    platform: linux/amd64
    container_name: cpr-shop-postgres-replica
    restart: unless-stopped
    depends_on:
      shop-postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${SHOP_POSTGRES_DB:-shopdb}
      POSTGRES_USER: ${SHOP_POSTGRES_USER:-shopuser}
      POSTGRES_PASSWORD: ${SHOP_POSTGRES_PASSWORD:-shoppass}
      PGUSER: ${SHOP_POSTGRES_USER:-shopuser}
    entrypoint: |
      bash -c "
        set -e
        until pg_isready -h shop-postgres-primary -p 5432 -U ${SHOP_POSTGRES_USER:-shopuser}; do
          echo 'Waiting for primary...'
          sleep 2
        done
        
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo 'Initializing replica from primary...'
          rm -rf /var/lib/postgresql/data/*
          PGPASSWORD=repl_password_123 pg_basebackup -h shop-postgres-primary -D /var/lib/postgresql/data -U replicator -vP -R -X stream
          chmod 700 /var/lib/postgresql/data
        fi
        
        exec docker-entrypoint.sh postgres -c hot_standby=on
      "
    volumes:
      - cpr_shop_replica_pgdata:/var/lib/postgresql/data
    networks:
      - cpr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHOP_POSTGRES_USER:-shopuser} -d ${SHOP_POSTGRES_DB:-shopdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

